*{box-sizing:border-box}
html,body{margin:0}

.p{border:1px solid #1f2521;border-radius:10px;padding:16px;background:#0E1211}

.ln:last-child{border-bottom:0}

.ln .s{color:#94C748;font-size:11px}
.in{margin-top:12px;color:#7c857f}.cur{display:inline-block;width:7px;height:13px;background:#94C748;vertical-align:-2px;margin-left:2px}
.ft{display:flex;justify-content:space-between;margin-top:14px;color:#5f6862;font-size:11px}
.q{color:#E8837A}
