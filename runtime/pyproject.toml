[project]
name = "fishd"
version = "0.1.0"
description = "Local MLX model server for Fish Stack"
requires-python = "==3.12.*"
dependencies = [
    "mlx==0.32.3",
    "mlx-lm==0.32.0",
    "mlx-embeddings==0.1.0",
    "transformers==5.19.0",
    "huggingface-hub==1.33.0",
]

[project.scripts]
fishd = "fishd.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fishd"]

[tool.uv]
package = true
